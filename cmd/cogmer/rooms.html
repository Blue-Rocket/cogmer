<!-- Served from the binary; no external requests. The list comes from this daemon's
     /rooms/stream, and every value from it is written as text, never as markup, since a
     colleague's chosen name is among them. A room is shown in a frame of its own page,
     /room/<name>, which keeps that room's place while the reader looks at another. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cogmer</title>
<style>
  :root {
    --bg:#faf9f7; --fg:#1c1b19; --dim:#6b6660; --line:#e3e0db;
    --card:#fff; --pick:#efece6; --me:#2f6f4f; --them:#3a5a8c; --warn:#a3521f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16150f; --fg:#e8e4dc; --dim:#8f8a82; --line:#2b2924;
           --card:#1d1c16; --pick:#25231c; --me:#7fc0a0; --them:#8fb3e0; --warn:#d99a5e; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);display:flex;
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  aside{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
  aside header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .conn{margin-left:auto;font-size:12px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;
       background:var(--dim);vertical-align:middle}
  .dot.live{background:var(--me)} .dot.down{background:var(--warn)}
  nav{overflow-y:auto;flex:1}
  a.room{display:block;padding:10px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
  a.room:hover{background:var(--pick)}
  a.room.picked{background:var(--pick);box-shadow:inset 3px 0 0 var(--them)}
  .top{display:flex;align-items:baseline;gap:8px}
  .rname{font-weight:600;font-size:14px}
  .new{margin-left:auto;font-size:11px;font-weight:600;color:var(--card);background:var(--them);
       border-radius:9px;padding:0 7px}
  .line{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .here{color:var(--me)} .line .warn{color:var(--warn)}
  .empty{padding:16px;color:var(--dim);font-size:14px}
  .empty code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  main{flex:1;height:100%;position:relative}
  main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
  main iframe.shown{display:block}
  .hint{padding:40px;color:var(--dim)}
  @media (max-width:760px){
    aside{width:100%;border-right:0} main{display:none}
  }
</style>
<aside>
  <header><h1>Rooms</h1><span class="conn" id="conn"><span class="dot" id="dot"></span><span id="connText">connecting</span></span></header>
  <nav id="list"></nav>
</aside>
<main id="pane"><p class="hint" id="hint">Pick a room to read it here.</p></main>
<script>
"use strict";
const list = document.getElementById('list');
const pane = document.getElementById('pane');
const narrow = window.matchMedia('(max-width:760px)');
const frames = {};
let rooms = [];
let picked = decodeURIComponent(location.hash.slice(1));

// What the reader has seen is kept in this browser only, as the count of a room's
// colleague turns at the last look. Without storage every room reads as seen.
function seen(name){ try { const v = localStorage.getItem('cogmer.seen.'+name); return v === null ? null : +v; } catch(e){ return null; } }
function see(name, n){ try { localStorage.setItem('cogmer.seen.'+name, String(n)); } catch(e){} }

function ago(iso){
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + ' min ago';
  if (s < 86400) return Math.floor(s/3600) + ' h ago';
  return Math.floor(s/86400) + ' d ago';
}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function newCount(r){
  const s = seen(r.name);
  if (s === null) { see(r.name, r.theirs); return 0; }
  return Math.max(0, r.theirs - s);
}

function render(){
  if (picked && !narrow.matches && document.visibilityState === 'visible') {
    const r = rooms.find(x => x.name === picked);
    if (r) see(r.name, r.theirs);
  }
  list.textContent = '';
  if (!rooms.length) {
    const p = el('p', 'empty', 'No rooms yet. Create one in a session: ');
    p.appendChild(el('code', '', '/cogmer:room-create'));
    p.appendChild(document.createTextNode(' in Claude Code, or '));
    p.appendChild(el('code', '', '$cogmer room-create'));
    p.appendChild(document.createTextNode(' in Codex.'));
    list.appendChild(p);
  }
  let total = 0;
  for (const r of rooms) {
    const a = el('a', 'room' + (r.name === picked ? ' picked' : ''));
    a.href = narrow.matches ? '/room/' + encodeURIComponent(r.name) : '#' + encodeURIComponent(r.name);
    const top = el('div', 'top');
    top.appendChild(el('span', 'rname', r.name));
    const n = r.name === picked && !narrow.matches ? 0 : newCount(r);
    total += n;
    if (n) top.appendChild(el('span', 'new', String(n)));
    a.appendChild(top);
    const last = el('div', 'line', r.lastAt ? (r.lastBy + ', ' + ago(r.lastAt)) : 'no turns yet');
    a.appendChild(last);
    const state = el('div', 'line');
    const bits = [];
    if (r.removed) bits.push(['warn', 'you were removed']);
    if (r.sessions) bits.push(['here', r.sessions === 1 ? 'a session here is in it' : r.sessions + ' sessions here are in it']);
    if (r.colleagues) bits.push(['', r.reachable + ' of ' + r.colleagues + (r.colleagues === 1 ? ' colleague' : ' colleagues') + ' reachable']);
    if (r.waiting) bits.push(['warn', r.waiting + ' not yet given to your assistant']);
    if (r.showOnly) bits.push(['', 'show only']);
    bits.forEach((b, i) => { if (i) state.appendChild(document.createTextNode(' · ')); state.appendChild(el('span', b[0], b[1])); });
    if (bits.length) a.appendChild(state);
    a.onclick = e => { if (!narrow.matches) { e.preventDefault(); pick(r.name); } };
    list.appendChild(a);
  }
  document.title = (total ? '(' + total + ') ' : '') + 'cogmer';
}

function pick(name){
  picked = name;
  history.replaceState(null, '', '#' + encodeURIComponent(name));
  document.getElementById('hint').style.display = 'none';
  if (!frames[name]) {
    const f = document.createElement('iframe');
    f.title = name;
    f.src = '/room/' + encodeURIComponent(name);
    pane.appendChild(f);
    frames[name] = f;
  }
  for (const k in frames) frames[k].classList.toggle('shown', k === name);
  render();
}

function connect(){
  const es = new EventSource('/rooms/stream');
  es.onopen = () => { document.getElementById('dot').className = 'dot live'; document.getElementById('connText').textContent = 'live'; };
  es.onmessage = m => {
    rooms = JSON.parse(m.data) || [];
    if (picked && !rooms.some(r => r.name === picked)) picked = '';
    if (picked && !frames[picked] && !narrow.matches) pick(picked); else render();
  };
  es.onerror = () => { document.getElementById('dot').className = 'dot down'; document.getElementById('connText').textContent = 'reconnecting'; };
}
document.addEventListener('visibilitychange', render);
narrow.addEventListener('change', render);
setInterval(render, 60000);
connect();
</script>
